<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TMB — Écran de gare</title>
  </head>
  <body>
    <header>
      <img class="logo" id="logo" alt="Tramway du Mont-Blanc" />
      <div class="gare-bloc">
        <div class="gare-nom" id="gare-nom"></div>
        <div class="gare-alt" id="gare-alt"></div>
      </div>
      <div class="heure-bloc">
        <div class="horloge" id="horloge">--:--<span class="sec">--</span></div>
        <div class="date" id="date-jour">—</div>
      </div>
    </header>

    <main>
      <div class="titre-tableau">
        <h1>Prochains départs</h1>
        <span class="en">Next departures</span>
      </div>
      <div class="gridrow entetes" id="entetes">
        <div>Départ<small>Departure</small></div>
        <div>Destination<small>Towards</small></div>
        <div>Train<small>Tram</small></div>
        <div>Départ dans<small>Departs in</small></div>
        <div>Statut<small>Status</small></div>
      </div>
      <div class="corps" id="corps"></div>
      <div class="plein-ecran" id="etat-special"></div>
      <div class="erreur-config" id="erreur-config"></div>
      <div class="arrivee" id="arrivee"></div>
    </main>

    <footer>
      <div class="ticker"><div class="ticker-inner" id="ticker"></div></div>
      <div class="meteo" id="meteo"></div>
    </footer>

    <div class="media-plein" id="media-plein"></div>
    <div class="neutre">
      <img class="logo-neutre" id="logo-neutre" alt="Tramway du Mont-Blanc" />
      <div class="horloge-neutre" id="horloge-neutre">--:--</div>
      <p>
        Informations momentanément indisponibles — adressez-vous au personnel<br />
        <span>Real-time information temporarily unavailable — please contact staff</span>
      </p>
    </div>
    <div class="badge-cache" id="badge-cache"></div>
    <div class="veille"><div class="horloge-veille" id="horloge-veille">--:--</div></div>

    <script src="./config.js"></script>
    <script type="module" src="/src/pages/ecran.ts"></script>
  </body>
</html>
