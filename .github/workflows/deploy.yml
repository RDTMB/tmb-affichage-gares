# Tests sur TOUTES les branches, déploiement GitHub Pages depuis `main`
# uniquement (docs/02 §6, docs/mise-en-service.md « Mise en ligne d'une
# évolution »). Un test rouge bloque la mise en ligne. config.js est généré
# depuis les VARIABLES de dépôt (Settings → Secrets and variables → Actions →
# Variables) : jamais de clé dans le code. La clé « publishable » Supabase est
# publique par conception.
name: Tests et déploiement GitHub Pages

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Une branche de travail n'annule jamais la mise en ligne de `main` : un
# groupe de concurrence par référence.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - name: Génère public/config.js depuis les variables de dépôt (main seulement)
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            printf 'window.TMB_CONFIG = { supabaseUrl: "%s", supabaseKey: "%s" };\n' "$SUPABASE_URL" "$SUPABASE_KEY" > public/config.js
            echo "config.js généré (mode Supabase)"
          else
            echo "::error::Variables de dépôt absentes ou mal nommées : VITE_SUPABASE_URL et VITE_SUPABASE_PUBLISHABLE_KEY sont requises (Settings → Secrets and variables → Actions → Variables). Déploiement REFUSÉ : sans elles, les écrans de gare n'auraient aucune source de données."
            exit 1
          fi
      # Sur une branche de travail, le build tourne SANS config.js : il prouve
      # que le code compile et se construit, rien n'est mis en ligne.
      - name: Build (base = /nom-du-depot/)
        run: npm run build -- --base=/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    # Mise en ligne depuis `main` seulement : jamais depuis une branche ni
    # depuis une pull request.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
