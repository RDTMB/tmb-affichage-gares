<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMB — Grille horaire du jour (maquette v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amaranth:wght@400;700&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --rouge:#E52A23; --rouge-fonce:#8B1419; --bleu-clair:#BDDCF4; --bleu-gris:#708DA4;
  --creme:#F1E5D1; --marine:#213B57; --marine-fonce:#182C42; --marine-ligne:#33517A; --marine-row:#26436A;
  --ok:#3FA96C; --retard:#F2A33C; --jaune:#F5CE5E; --texte-sec:#A9C0D8; --texte-ter:#7C96B0;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--marine);color:#fff;font-family:"Lato","Segoe UI",Arial,sans-serif;display:flex;flex-direction:column}
header{background:var(--creme);color:var(--marine);flex:0 0 12vh;position:relative;display:flex;align-items:center;justify-content:space-between;border-bottom:.9vh solid var(--rouge);padding:0 1.5vw}
.logo{height:10.4vh;width:auto}
.titre-bloc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;white-space:nowrap}
.titre-bloc h1{font-family:"Amaranth",sans-serif;font-weight:700;font-size:4.6vh;line-height:1;color:var(--marine)}
.titre-bloc .en{font-weight:700;font-size:1.9vh;color:var(--rouge);letter-spacing:.22em;text-transform:uppercase;margin-top:.5vh}
.heure-bloc{text-align:right}
.horloge{font-weight:900;font-size:5.8vh;line-height:1;font-variant-numeric:tabular-nums;color:var(--marine)}
.horloge .sec{font-size:2.8vh;color:var(--rouge);font-weight:700}
.date{font-size:1.85vh;color:var(--bleu-gris);font-weight:700;margin-top:.4vh}

main{flex:1;display:flex;flex-direction:column;padding:1vh 1.2vw;gap:.8vh;overflow:hidden}
.sens{flex:1;display:flex;flex-direction:column;min-height:0}
.sens h2{font-family:"Amaranth",sans-serif;font-size:2.2vh;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.2vh .2vw .6vh;flex:none;display:flex;align-items:center;gap:.8vw}
.sens h2 .fl{color:var(--bleu-clair);font-family:"Lato",sans-serif}
.sens h2 span.en{color:var(--texte-sec);font-weight:400;letter-spacing:.04em;text-transform:none;font-size:1.75vh;font-family:"Lato",sans-serif}
.tabwrap{flex:1;min-height:0;overflow:hidden}
table{width:100%;height:100%;border-collapse:collapse;table-layout:fixed}
th,td{border:1px solid var(--marine-ligne);text-align:center;position:relative}
thead th{background:#1B3252;font-size:2.25vh;font-weight:900;padding:.3vh 0;font-variant-numeric:tabular-nums}
thead th .num{display:block;font-size:1.35vh;font-weight:700;color:var(--texte-ter);letter-spacing:.06em}
thead th .picto{display:block;font-size:1.35vh;line-height:1.4;font-weight:900;color:var(--jaune)}
thead th img.motrice{height:3.3vh;width:auto;display:inline-block;vertical-align:middle}
thead th .velo{color:var(--bleu-clair);font-size:1.5vh}
thead th.col-gare{width:10vw;background:#1B3252;font-size:1.55vh;letter-spacing:.12em;color:var(--texte-ter);font-weight:700}
tbody th{background:var(--marine-row);font-size:1.85vh;font-weight:700;text-align:left;padding:.25vh .7vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:"Amaranth",sans-serif;letter-spacing:.02em}
tbody th small{display:block;font-size:1.3vh;color:var(--texte-ter);font-weight:400;font-family:"Lato",sans-serif}
tbody td{background:var(--marine);font-size:2.25vh;font-weight:700;font-variant-numeric:tabular-nums;padding:.15vh 0}
td.saute{color:#4A6486;font-size:1.85vh}
td.passe,th.passe{opacity:.36}
th.next,td.next{background:#2C5580 !important;box-shadow:inset 0 0 0 2px #5E86B4}
thead th.retard,td.retard{color:var(--retard)}
thead th.retard .badge,thead th.supp .badge{display:block;font-size:1.25vh;font-weight:900}
thead th.supp{color:#FF8A7E}
td.supp{color:#5E7890;text-decoration:line-through}
.train-pos{position:absolute;right:.3vw;top:50%;transform:translateY(-50%);width:1.7vh;height:1.7vh;border-radius:50%;animation:pulse 1.4s ease-in-out infinite;box-shadow:0 0 0 2px rgba(24,44,66,.75),0 0 .9vh rgba(255,255,255,.9)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.legende{flex:0 0 3.8vh;display:flex;align-items:center;gap:1vw;font-size:1.45vh;color:var(--texte-sec);padding:0 .3vw;white-space:nowrap;overflow:hidden}
.legende .item{display:flex;align-items:center;gap:.4vw}
.legende .rame-dot{width:1.7vh;height:1.7vh;border-radius:50%}
.legende b{color:#fff;font-weight:700}
.legende img.motrice{height:2.8vh;width:auto}
.legende .maquette{margin-left:auto;color:#54718F;letter-spacing:.08em;font-weight:700}

footer{flex:0 0 7.5vh;display:flex;align-items:stretch;background:var(--rouge);color:#fff}
.ticker{flex:1;overflow:hidden;display:flex;align-items:center}
.ticker-inner{display:inline-block;white-space:nowrap;animation:defile 80s linear infinite;font-size:2.6vh;font-weight:700;padding-left:100vw}
.ticker-inner .sep{opacity:.55;margin:0 2vw}
.ticker-inner .en{font-weight:400;opacity:.95}
@keyframes defile{to{transform:translateX(-100%)}}
.meteo{flex:0 0 auto;display:flex;align-items:center;gap:.9vw;padding:0 1.6vw;background:var(--rouge-fonce);font-weight:700;font-size:2.1vh}
.meteo .t{font-size:3.9vh;font-weight:900}
.meteo small{display:block;font-size:1.5vh;font-weight:400;opacity:.9;letter-spacing:.06em;text-transform:uppercase}

.controls{position:fixed;top:1.4vh;left:50%;transform:translateX(-50%);z-index:100;background:rgba(24,44,66,.95);border:1px solid #3A5E88;border-radius:1.1vh;padding:.9vh 1vw;display:flex;gap:.8vw;align-items:center;opacity:0;transition:opacity .3s;color:#D8E8F8;font-size:1.8vh}
body.show-controls .controls{opacity:1}
.controls select,.controls button{font:inherit;background:#26436A;color:#fff;border:1px solid #4A6E9C;border-radius:.6vh;padding:.4vh .6vw;cursor:pointer}
</style>
</head>
<body>

<div class="controls">
  <select id="selHeure">
    <option value="reel">Heure réelle</option>
    <option value="10:18">Simuler 10:18</option>
    <option value="13:05">Simuler 13:05</option>
    <option value="16:50">Simuler 16:50</option>
  </select>
  <button id="btnFs">Plein écran</button>
</div>

        const offs=gares.filter(x=>marche[x.id]!==undefined).map(x=>({id:x.id,o:marche[x.id]}));
        const elapsed=(n-dateAt(m.dep0))/1000-m.ret*60;
        let segId=offs[0].id;offs.forEach(x=>{if(elapsed>=x.o)segId=x.id;});
        if(segId===g.id)pos=`<span class="train-pos" style="background:${m.rame.c}"></span>`;
      }
      html+=`<td class="${cls}">${hm(heure)}${pos}</td>`;
    });
    html+="</tr>";
  });
  return html+"</tbody>";
}
function rendre(){
  const n=now();
  document.getElementById("horloge").innerHTML=hm(n)+'<span class="sec">'+String(n.getSeconds()).padStart(2,"0")+"</span>";
  const dstr=n.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  document.getElementById("date").textContent=dstr.charAt(0).toUpperCase()+dstr.slice(1);
  document.getElementById("tabM").innerHTML=construire("m");
  document.getElementById("tabD").innerHTML=construire("d");
}
