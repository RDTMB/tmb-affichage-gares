<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMB — Écran gare (maquette v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amaranth:wght@400;700&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
/* ============ CHARTE GRAPHIQUE TMB 2026 ============ */
:root{
  --rouge:#E52A23; --rouge-fonce:#8B1419;
  --bleu-clair:#BDDCF4; --bleu-gris:#708DA4;
  --creme:#F1E5D1; --marine:#213B57;
  --marine-fonce:#182C42; --marine-ligne:#33517A; --marine-row:#26436A;
  --ok:#3FA96C; --retard:#F2A33C; --jaune:#F5CE5E;
  --texte-sec:#A9C0D8; --texte-ter:#7C96B0;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:var(--marine-fonce);color:#fff;
  font-family:"Lato","Segoe UI",Arial,sans-serif;
  display:flex;flex-direction:column;
}
.titrage{font-family:"Amaranth","Lato",sans-serif}
/* ============ BANDEAU HAUT ============ */
header{
  background:var(--creme);color:var(--marine);
  flex:0 0 14vh;position:relative;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:.9vh solid var(--rouge);
  padding:0 1.6vw;
}
.logo{height:12.2vh;width:auto;flex:none}
.gare-bloc{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  text-align:center;white-space:nowrap;
}
.gare-nom{font-family:"Amaranth",sans-serif;font-weight:700;font-size:6.4vh;line-height:1;color:var(--marine)}
.gare-alt{font-weight:700;font-size:2.1vh;color:var(--rouge);letter-spacing:.28em;text-transform:uppercase;margin-top:.7vh}
.heure-bloc{text-align:right}
.horloge{font-weight:900;font-size:6.8vh;line-height:1;font-variant-numeric:tabular-nums;color:var(--marine)}
.horloge .sec{font-size:3.2vh;color:var(--rouge);font-weight:700}
.date{font-size:1.95vh;color:var(--bleu-gris);font-weight:700;margin-top:.5vh}
/* ============ TABLEAU ============ */
main{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--marine)}
.titre-tableau{display:flex;align-items:baseline;gap:1.2vw;padding:1.5vh 2vw .7vh}
.titre-tableau h1{font-family:"Amaranth",sans-serif;font-size:3.2vh;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.titre-tableau .en{font-size:2vh;color:var(--texte-sec);font-weight:400;letter-spacing:.06em}
.gridrow{display:grid;grid-template-columns:8vw 11.5vw 1fr 14.5vw 11.5vw 12.5vw;gap:.9vw;align-items:center;padding:0 1.8vw}
.entetes{font-size:1.7vh;letter-spacing:.14em;text-transform:uppercase;color:var(--texte-ter);font-weight:700;padding-bottom:.7vh}
.entetes small{display:block;font-size:1.4vh;letter-spacing:.06em;color:#5E7License890;color:#5E7890;text-transform:none;font-weight:400}
.corps{flex:1;display:flex;flex-direction:column}
.rangee{flex:1;min-height:0;border-top:1px solid var(--marine-ligne);background:var(--marine)}
.rangee:nth-child(even){background:var(--marine-row)}
.rangee.supprime .r-dep,.rangee.supprime .r-dest .dest{text-decoration:line-through;opacity:.42}
.r-arr{font-weight:400;font-size:3.1vh;color:var(--texte-sec);font-variant-numeric:tabular-nums}
.r-arr .tiret{color:#4A6486}
.r-dep{font-weight:900;font-size:5.6vh;font-variant-numeric:tabular-nums;line-height:1}
.r-dep .retard-old{display:block;font-size:1.9vh;color:var(--retard);font-weight:700}
.r-dest{display:flex;align-items:center;gap:1vw;min-width:0}
.fleche{
  width:5vh;height:5vh;flex:none;border-radius:1vh;
  display:flex;align-items:center;justify-content:center;
}
.fleche svg{width:3.2vh;height:3.2vh}
.fleche.up{background:#2C5580}
.fleche.down{background:#1B3A5E}
.r-dest .txt{min-width:0}
.r-dest .dest{font-family:"Amaranth",sans-serif;font-weight:700;font-size:4.3vh;line-height:1.08;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-dest .dest img.motrice-dest{height:7vh;width:auto;vertical-align:-1.9vh;margin-left:1.4vw}
.r-dest .note{font-size:1.95vh;color:var(--texte-sec);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:.5vw}
.r-dest .note b{color:var(--retard);font-weight:700}
.r-dest .note .exp{color:var(--jaune);font-weight:700}
.r-dest .note img.motrice{height:3vh;width:auto;vertical-align:middle;margin-right:.3vw}
.r-dest .note.note-exp{font-size:1.62vh}
.r-train{display:flex;align-items:center;gap:.7vw;min-width:0}
.pastille{width:3vh;height:3vh;border-radius:50%;flex:none;box-shadow:0 0 0 .4vh rgba(255,255,255,.14)}
.r-train .txt{min-width:0}
.r-train .nom-rame{font-size:2.6vh;font-weight:700;color:#E8F0F8;line-height:1.15;white-space:nowrap}
.r-train .num{display:block;font-size:1.7vh;color:var(--texte-ter);font-weight:700;letter-spacing:.08em}
.chip{
  font-weight:900;font-size:3.2vh;padding:1vh 0;border-radius:1.1vh;white-space:nowrap;
  background:#1A3454;border:1px solid #3A5E88;color:#D8E8F8;font-variant-numeric:tabular-nums;
  width:10.5vw;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;
}
.chip.proche{color:#fff;border-color:#5E86B4;background:#254A74}
.chip.quai{background:var(--ok);border-color:var(--ok);color:#06301A;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.r-statut{font-size:2.5vh;font-weight:700}
.r-statut span{white-space:nowrap}
.r-statut small{display:block;font-size:1.75vh;font-weight:400;color:var(--texte-ter);padding-left:1.4vw}
.st-ok{color:var(--ok)}.st-retard{color:var(--retard)}.st-supp{color:#FF6B5E;text-transform:uppercase;letter-spacing:.04em}
.st-ok::before,.st-retard::before,.st-supp::before{content:"●";margin-right:.5vw;font-size:1.7vh;vertical-align:.4vh}
/* Arrivée + états spéciaux */
.arrivee{
  border-top:1px solid var(--marine-ligne);background:#1B3252;
  display:flex;align-items:center;gap:.9vw;padding:1.2vh 2vw;flex:0 0 auto;
  font-size:2.25vh;color:var(--texte-sec);
}
.arrivee b{color:#fff;font-weight:900}
.arrivee .lbl{letter-spacing:.14em;text-transform:uppercase;font-size:1.75vh;color:var(--texte-ter);font-weight:700}
.arrivee .rame-col{font-weight:900}
.maquette-tag{margin-left:auto;color:#54718F;font-size:1.6vh;letter-spacing:.1em;font-weight:700;white-space:nowrap}
.plein-ecran{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.6vh;text-align:center;padding:0 6vw}
.plein-ecran h2{font-family:"Amaranth",sans-serif;font-size:5.6vh;font-weight:700}
.plein-ecran p{font-size:2.8vh;color:var(--texte-sec);line-height:1.5}
.plein-ecran img.logo-fin{height:20vh;width:auto;opacity:.95;margin-top:1vh}
/* ============ BAS ============ */
footer{flex:0 0 8.5vh;display:flex;align-items:stretch;background:var(--rouge);color:#fff}
.ticker{flex:1;overflow:hidden;display:flex;align-items:center}
.ticker-inner{display:inline-block;white-space:nowrap;animation:defile 80s linear infinite;font-size:2.9vh;font-weight:700;padding-left:100vw}
.ticker-inner .sep{opacity:.55;margin:0 2.2vw}
.ticker-inner .en{font-weight:400;opacity:.95}
@keyframes defile{to{transform:translateX(-100%)}}
.meteo{flex:0 0 auto;display:flex;align-items:center;gap:1vw;padding:0 1.8vw;background:var(--rouge-fonce);font-weight:700;font-size:2.3vh}
.meteo .t{font-size:4.4vh;font-weight:900}
.meteo small{display:block;font-size:1.65vh;font-weight:400;opacity:.9;letter-spacing:.06em;text-transform:uppercase}
/* ============ OUTILS MAQUETTE ============ */
.controls{
  position:fixed;top:1.5vh;left:50%;transform:translateX(-50%);z-index:100;
  background:rgba(24,44,66,.95);border:1px solid #3A5E88;border-radius:1.2vh;
  padding:1vh 1vw;display:flex;gap:.8vw;align-items:center;
  opacity:0;transition:opacity .3s;color:#D8E8F8;font-size:1.85vh;
}
body.show-controls .controls{opacity:1}
.controls select,.controls button,.controls label{font:inherit;background:#26436A;color:#fff;border:1px solid #4A6E9C;border-radius:.6vh;padding:.5vh .6vw;cursor:pointer}
.controls label{display:flex;align-items:center;gap:.4vw;border:none;background:none}
.controls .astuce{color:#7C96B0;font-size:1.55vh}
</style>
</head>
<body>

<div class="controls" id="controls">
  <span>Maquette :</span>
  <select id="selGare"></select>
  <select id="selHeure">
    <option value="reel">Heure réelle</option>
    <option value="10:18">Simuler 10:18</option>
    <option value="13:05">Simuler 13:05</option>
    <option value="16:50">Simuler 16:50</option>
    <option value="21:00">Simuler 21:00 (service terminé)</option>
  </select>
  <label><input type="checkbox" id="chkBellevue"> Terminus Bellevue (météo)</label>
  <button id="btnFs">Plein écran</button>
  <span class="astuce">G = gare · T = heure · F = plein écran</span>
</div>

  DESCENTES.forEach((t,i)=>{
    const [num,dep0,exp,fac]=t;
    if(fac&&!JOUR.facultatifsActifs.has(num))return;
    if(terminusBellevue&&exp)return;
    const marche=exp?D_EXP:D_NORM;
    let arrs=marche[gid];if(!arrs)return;
    if(terminusBellevue){
      if(gid==="nid-daigle")return;
      if(gid==="bellevue")arrs=[null,1200];             // départ de Bellevue à l'heure de passage
    }
    const ret=(JOUR.retards[num]?.min||0)*60000, sup=JOUR.supprimes[num];
    const base=dateAt(dep0).getTime()+ret;
    res.push({num,sens:"down",dest:"Le Fayet",
      arr:arrs[0]!=null?new Date(base+arrs[0]*1000):null,
      dep:arrs[1]!=null?new Date(base+arrs[1]*1000):null,
      theor:arrs[1]!=null?new Date(dateAt(dep0).getTime()+arrs[1]*1000):null,
      exp,velos:t[4],rame:RAMES[i%4],retard:JOUR.retards[num],sup});
  });

function arriveesPourGare(gid){
  const res=[];
  const add=(list,marches,sens,prov)=>list.forEach((t,i)=>{
    const [num,dep0,exp,fac]=t;
    if(fac&&!JOUR.facultatifsActifs.has(num))return;
    if(JOUR.supprimes[num])return;
    if(terminusBellevue&&(exp||gid==="nid-daigle"))return;
    const marche=exp?marches[1]:marches[0];let arrs=marche[gid];if(!arrs||arrs[0]==null)return;
    const base=dateAt(dep0).getTime()+((JOUR.retards[num]?.min||0)*60000);
    res.push({num,arr:new Date(base+arrs[0]*1000),rame:RAMES[i%4],prov,sens});
  });
  add(MONTEES,[M_NORM,M_EXP],"up","Le Fayet");
  add(DESCENTES,[D_NORM,D_EXP],"down",terminusBellevue?"Bellevue":"Nid d'Aigle");
  return res.sort((a,b)=>a.arr-b.arr);
}
function compte(dep){
  const diff=(dep-now())/60000;
  if(diff<=0)return {txt:"À QUAI",cls:"quai"};
  if(diff<1)return {txt:"< 1 min",cls:"quai"};
  const m=Math.ceil(diff);
  if(m>=60){const h=Math.floor(m/60);return {txt:h+" h "+String(m%60).padStart(2,"0"),cls:""};}
  return {txt:m+" min",cls:m<=5?"proche":""};
}

function majArrivee(arrs){
  const tag='<span class="maquette-tag">MAQUETTE · horaires réels été 2026, perturbations simulées</span>';
  $("arrivee").innerHTML=(arrs.length
    ?`<span class="lbl">Prochaine arrivée / Next arrival</span>
      <b>${hm(arrs[0].arr)}</b> — <span class="rame-col" style="color:${arrs[0].rame.c};${arrs[0].rame.c==="#FFFFFF"?"text-shadow:0 0 4px #E52A23;":""}">${arrs[0].rame.nom}</span>
      <span>(TRAIN ${arrs[0].num}), en provenance de ${arrs[0].prov}</span>`
    :`<span class="lbl">Prochaine arrivée / Next arrival</span> — demain / tomorrow`)+tag;
}
$("ticker").innerHTML=MSGS.map(m=>`${m.fr}<span class="sep">•</span><span class="en">${m.en}</span>`).join('<span class="sep">◆</span>');

/* ============ COMMANDES MAQUETTE ============ */
const selGare=$("selGare");
GARES.forEach((g,i)=>{const o=document.createElement("option");o.value=i;o.textContent=g.nom;selGare.appendChild(o);});
const param=new URLSearchParams(location.search).get("gare");
if(param){const i=GARES.findIndex(g=>g.id===param);if(i>=0)gIdx=i;}
selGare.value=gIdx;
selGare.onchange=e=>{gIdx=+e.target.value;rendre();};
$("selHeure").onchange=e=>{setSim(e.target.value);rendre();};
$("chkBellevue").onchange=e=>{terminusBellevue=e.target.checked;rendre();};
$("btnFs").onclick=()=>document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
let hideTimer;
document.addEventListener("mousemove",()=>{document.body.classList.add("show-controls");
  clearTimeout(hideTimer);hideTimer=setTimeout(()=>document.body.classList.remove("show-controls"),4000);});
document.addEventListener("keydown",e=>{
  if(e.key==="g"||e.key==="G"){gIdx=(gIdx+1)%GARES.length;selGare.value=gIdx;rendre();}
  if(e.key==="t"||e.key==="T"){const s=$("selHeure");s.selectedIndex=(s.selectedIndex+1)%s.options.length;setSim(s.value);rendre();}
  if(e.key==="f"||e.key==="F"){$("btnFs").click();}
});
rendre();setInterval(rendre,1000);
</script>
